# The slides of the complete Vision Inspection video (both phases).
#   uv run --no-project --with pyyaml python ../../forgeflow_reveal/deck.py slides.yaml deck/
# flow.py records `intro` before the live demo and `outro` after it.
title: "Vision Inspection: from the camera to the quality inspection"
video:
  intro: [cover, problem, how, model, results, verdict, live]
  outro: [summary, next, end]
slides:
  - id: cover
    kind: cover
    title: Vision Inspection
    subtitle: "Computer vision quality control in Odoo, from the camera to the quality inspection"
    say: >-
      This is Vision Inspection: computer vision quality control in Odoo.
      In a few minutes, we follow circuit boards from a camera on the line to a quality inspection in Odoo.

  - id: problem
    kind: cards
    title: Cameras find the defects. Then what?
    cards:
      - ["Cameras on the line", "A model checks every board", "1"]
      - ["Results stay on the machine", "No traceability, no follow-up", "2"]
      - ["Many vision systems", "Each with its own format", "3"]
      - ["Quality lives in Odoo", "Inspections, approvals, reports", "4"]
    footer: "The goal: every result in Odoo, whatever system produced it."
    say:
      - "More and more factories inspect their products with cameras."
      - "A vision model looks at every board coming off the line, and finds its defects."
      - "But those results usually stay on the machine that runs the model."
      - "And every vision system has its own format."
      - "Meanwhile, quality is managed in Odoo. That is where the results belong."

  - id: how
    kind: flow
    title: Two parts, one flow
    steps:
      - ["Camera and model", "RF-DETR finds the defects of each board"]
      - ["Push to Odoo", "One call per board: image, boxes, confidences"]
      - ["Verdict", "Pass, to review or fail, decided in Odoo"]
      - ["Quality control", "An OCA inspection, approved by a manager"]
    footer: "Built only on pieces free for commercial use."
    say:
      - "The project has two parts, joined by one flow."
      - "On the line, a camera and a vision model find the defects of each board."
      - "The machine pushes its results to Odoo: the image, the boxes it found, and how sure it is."
      - "Odoo stores the inspection and decides the verdict: pass, to review, or fail."
      - "Boards that don't pass become quality control inspections, from the OCA module, for a manager to approve."

  - id: model
    kind: statement
    title: "The model: RF-DETR, trained on real circuit boards"
    points:
      - ["VisA dataset", "Public circuit board photos, free for commercial use: 300 defective boards."]
      - ["Four defects", "Bent pins, melted solder, scratches, missing components."]
      - ["RF-DETR Nano", "Fine-tuned in about half an hour on a free Colab GPU; runs on a laptop CPU."]
    say:
      - "First, the model."
      - "It learned from VisA, a public dataset of circuit board photos, with three hundred defective boards."
      - "It finds four defects: bent pins, melted solder, scratches, and missing components."
      - "The model is RF-DETR Nano, fine-tuned in about half an hour on a free Colab GPU. It then runs on a regular laptop CPU."

  - id: results
    kind: cards
    title: On 90 boards it had never seen
    cards:
      - ["43 of 45 defective boards caught", "96% of the bad boards stopped", "1"]
      - ["44 of 45 good boards passed", "One false alarm", "2"]
      - ["Under a second per board", "On a laptop CPU, no GPU", "3"]
      - ["Every result in Odoo", "Image, boxes and verdict", "4"]
    footer: "Measured on held-out test boards, never used in training."
    say:
      - "Here is how it does on ninety test boards it had never seen."
      - "It caught forty three of the forty five defective boards."
      - "And it passed forty four of the forty five good ones: a single false alarm."
      - "Each board takes under a second, on a laptop processor."
      - "And every result lands in Odoo."

  - id: verdict
    kind: statement
    title: The verdict, decided in Odoo
    points:
      - ["Minimum confidence", "Weaker detections are kept, but not counted."]
      - ["Allowed per board", "One defect too many, and the board fails."]
      - ["Review confidence", "Uncertain detections go to a person."]
    say:
      - "Odoo decides the verdict with three simple rules."
      - "Detections below a minimum confidence are kept, but not counted."
      - "Each defect class says how many are allowed on a board. One more, and the board fails."
      - "And when the model isn't sure enough, the board goes to review, so a person decides."

  - id: live
    kind: section
    number: 1
    title: Live in Odoo
    subtitle: "Configure, inspect, decide, approve"
    say: "Let's see it live."

  - id: summary
    kind: summary
    title: In summary
    points:
      - "A real defect detector, trained on public data, running on a CPU"
      - "One endpoint in Odoo for any vision system"
      - "Verdicts decided in Odoo, with images and boxes kept"
      - "OCA quality inspections, approved by a manager"
    say:
      - "To sum up."
      - "A real defect detector, trained on public data, runs on a regular CPU next to the line."
      - "Odoo receives the results of any vision system through one endpoint."
      - "Odoo decides each verdict, and keeps every image with its boxes."
      - "And boards that don't pass reach quality control, for a manager to approve."

  - id: next
    kind: flow
    title: Next steps
    steps:
      - ["A real camera", "An industrial camera instead of photos"]
      - ["Your products", "A dataset of your own defects"]
      - ["Edge devices", "Export the model to ONNX"]
      - ["More quality apps", "Odoo Quality as well as OCA"]
    footer: "Every piece open and free for commercial use."
    say:
      - "And the next steps."
      - "Replace the photos with an industrial camera on the line."
      - "Train the model on your own products and your own defects."
      - "Export it to run on small edge devices."
      - "And connect it to Odoo's own Quality app, as well as O C A."

  - id: end
    kind: cover
    title: Thank you
    subtitle: "Vision Inspection · ForgeFlow"
    say: "Thank you for watching."
