<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Line camera</title>
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(../../forgeflow_reveal/vendor/inter/inter-latin-400-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 600; src: url(../../forgeflow_reveal/vendor/inter/inter-latin-600-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 800; src: url(../../forgeflow_reveal/vendor/inter/inter-latin-800-normal.woff2); }
  :root { --bg: #11161d; --panel: #1a222c; --line: #2a3542; --text: #e6edf3; --muted: #8b98a8;
          --blue: #3d7bd9; --ok: #2fbf71; --warn: #f0a83a; --bad: #e5484d; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: var(--bg); color: var(--text);
         font: 16px/1.4 Inter, system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 18px 28px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .live { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 10px var(--bad); }
  .badge { padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
           color: var(--muted); font-size: 14px; }
  main { flex: 1; display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; padding: 24px 28px; min-height: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px;
           display: flex; flex-direction: column; min-height: 0; }
  .panel h2 { margin: 0 0 12px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .frame { position: relative; align-self: center; max-width: 100%; }
  .frame img { display: block; max-width: 100%; max-height: 560px; border-radius: 6px; }
  .box { position: absolute; border: 3px solid var(--warn); border-radius: 3px; }
  .box span { position: absolute; bottom: 100%; left: -3px; padding: 1px 6px; font-size: 13px; font-weight: 600;
              background: var(--warn); color: #111; white-space: nowrap; }
  .box.missing { border-color: var(--bad); } .box.missing span { background: var(--bad); color: #fff; }
  .box.scratch { border-color: #4fb3f6; } .box.scratch span { background: #4fb3f6; }
  .box.low { border-style: dashed; opacity: .75; }
  pre { flex: 1; margin: 0; overflow: hidden; padding: 14px; border-radius: 8px; background: #0d1117;
        font: 14px/1.45 ui-monospace, "DejaVu Sans Mono", monospace; color: #c9d4df; white-space: pre-wrap; }
  .key { color: #7cc4ff; } .str { color: #a5d6a7; } .num { color: #f6c177; }
  .actions { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
  button { font: 600 18px Inter, sans-serif; padding: 12px 22px; border: 0; border-radius: 8px; color: #fff;
           background: var(--blue); cursor: pointer; }
  button:disabled { opacity: .6; }
  #endpoint { color: var(--muted); font-size: 13px; word-break: break-all; }
  #response { margin-top: 14px; padding: 14px 16px; border-radius: 8px; background: #0d1117; min-height: 58px;
              font: 15px ui-monospace, monospace; display: none; }
  #response.show { display: block; }
  .status { font-weight: 700; margin-right: 10px; }
  .verdict { display: inline-block; margin-left: 8px; padding: 2px 12px; border-radius: 999px; font: 700 15px Inter; color: #111; }
  .verdict.pass { background: var(--ok); } .verdict.review { background: var(--warn); } .verdict.fail { background: var(--bad); color: #fff; }
</style>
</head>
<body>
<header>
  <span class="live"></span>
  <h1 id="title">Line camera</h1>
  <span class="badge" id="model">model</span>
  <span class="badge" id="adapter">format</span>
</header>
<main>
  <section class="panel">
    <h2>Captured board · detections</h2>
    <div class="frame" id="frame"><img id="image" alt="Board"/></div>
  </section>
  <section class="panel">
    <h2>Results to send</h2>
    <pre id="payload"></pre>
    <div class="actions">
      <button id="send" type="button">Send to Odoo</button>
      <span id="endpoint"></span>
    </div>
    <div id="response"></div>
  </section>
</main>
<script>
  function colour(json) {
    const escape = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    return json.replace(/("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d+(?:\.\d+)?)/g, (match, str, colon, num) => {
      if (num) return `<span class="num">${num}</span>`;
      return `<span class="${colon ? "key" : "str"}">${escape(str)}</span>${colon || ""}`;
    });
  }
  window.showSample = function (sample) {
    document.getElementById("title").textContent = sample.title;
    document.getElementById("model").textContent = sample.model;
    document.getElementById("adapter").textContent = sample.adapter;
    document.getElementById("endpoint").textContent = "POST " + sample.endpoint;
    document.getElementById("payload").innerHTML = colour(sample.payloadText);
    document.getElementById("response").className = "";
    const send = document.getElementById("send");
    send.disabled = false;
    send.textContent = "Send to Odoo";
    const frame = document.getElementById("frame");
    frame.querySelectorAll(".box").forEach((box) => box.remove());
    const image = document.getElementById("image");
    image.onload = () => {
      for (const d of sample.detections) {
        const box = document.createElement("div");
        box.className = `box ${d.label}${d.confidence < 0.5 ? " low" : ""}`;
        Object.assign(box.style, {
          left: `${d.bbox.x * 100}%`, top: `${d.bbox.y * 100}%`,
          width: `${d.bbox.w * 100}%`, height: `${d.bbox.h * 100}%`,
        });
        box.innerHTML = `<span>${d.label} ${Math.round(d.confidence * 100)}%</span>`;
        frame.appendChild(box);
      }
    };
    image.src = sample.image;
  };
  document.getElementById("send").addEventListener("click", (event) => {
    event.target.disabled = true;
    event.target.textContent = "Sending…";
  });
  window.showResponse = function (status, body) {
    const response = document.getElementById("response");
    const verdict = body.verdict ? `<span class="verdict ${body.verdict}">${body.verdict.toUpperCase()}</span>` : "";
    response.innerHTML = `<span class="status">${status}</span>${body.inspection || body.error || ""}${verdict}`;
    response.className = "show";
    document.getElementById("send").textContent = "Sent";
  };
</script>
</body>
</html>
