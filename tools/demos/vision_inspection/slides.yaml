# The slides of the Vision Inspection video (phase 1).
#   uv run --no-project --with pyyaml python ../../forgeflow_reveal/deck.py slides.yaml deck/
# The flow (flow.py) records slides `intro` before the live demo and `outro` after it.
title: "Vision Inspection: computer vision quality control in Odoo"
video:
  intro: [cover, problem, how, verdict, live]
  outro: [summary, next, end]
slides:
  - id: cover
    kind: cover
    title: Vision Inspection
    subtitle: "Computer vision quality control in Odoo · Phase 1: the connector"
    say: >-
      Vision Inspection brings computer vision quality control into Odoo.
      This video shows the first phase of the project: the connector between the vision systems and Odoo.

  - id: problem
    kind: cards
    title: Cameras find the defects. Then what?
    cards:
      - ["Cameras on the line", "A model checks every sample", "1"]
      - ["Results stay on the machine", "No traceability, no follow-up", "2"]
      - ["Many vision systems", "RF-DETR, Roboflow, smart cameras", "3"]
      - ["Quality lives in Odoo", "Inspections, approvals, reports", "4"]
    footer: "The connector brings every result into Odoo, whatever system produced it."
    say:
      - "More and more factories inspect their products with cameras."
      - "A model looks at every sample coming off the line, and finds its defects: a scratch, a missing component."
      - "But those results usually stay on the machine that runs the model."
      - "And there are many vision systems, each with its own format."
      - "Meanwhile, quality is managed in Odoo. That is where the results belong."

  - id: how
    kind: flow
    title: How it works
    steps:
      - ["Camera and model", "Detects the defects of each image"]
      - ["Push to Odoo", "One HTTP call per sample, with a token"]
      - ["Verdict", "Pass, to review or fail"]
      - ["Quality control", "An OCA inspection, approved by a manager"]
    footer: "A new vision system only needs a small adapter for its format."
    say:
      - "Here is how it works."
      - "The machine on the line runs the vision model on each image."
      - "It pushes its results to Odoo: one HTTP call per sample, with the image, the boxes it found, and a token."
      - "Odoo stores the inspection and decides the verdict: pass, to review, or fail."
      - "Samples that don't pass become quality control inspections, from the OCA module, which a quality manager approves."

  - id: verdict
    kind: statement
    title: The verdict, decided in Odoo
    points:
      - ["Minimum confidence", "Weaker detections are kept, but not counted."]
      - ["Allowed per sample", "Too many defects of one class: the sample fails."]
      - ["Review confidence", "Uncertain detections go to a person."]
    say:
      - "The verdict follows three simple rules, set per station and per defect class."
      - "Detections below a minimum confidence are kept, but not counted."
      - "Each defect class says how many are allowed on one sample. One more, and the sample fails."
      - "And when the model isn't sure enough, the sample goes to review, so a person decides."

  - id: live
    kind: section
    number: 1
    title: Live in Odoo
    subtitle: "Configure, receive, decide, approve"
    say: "Let's see it live in Odoo."

  - id: summary
    kind: summary
    title: Phase 1 in summary
    points:
      - "One endpoint for any vision system, with pluggable formats"
      - "Verdicts decided in Odoo, or trusted from the source"
      - "Images with their detections, and defect reports"
      - "OCA quality inspections, approved by a manager"
    say:
      - "To sum up the first phase."
      - "One endpoint receives the results of any vision system, through pluggable formats."
      - "Odoo decides the verdict, or trusts the one the system sends."
      - "Every image is kept with its detections, and the defects can be analysed."
      - "And samples that don't pass reach OCA quality control, for a manager to approve."

  - id: next
    kind: flow
    title: "Next: phase 2, a real model"
    steps:
      - ["Public dataset", "VisA, free for commercial use"]
      - ["RF-DETR Nano", "Fine-tuned on a CPU, Apache 2.0"]
      - ["Simulated conveyor", "Images streamed, no camera"]
      - ["Into Odoo", "Through this same connector"]
    footer: "Every piece open and free for commercial use."
    say:
      - "In the second phase, a real model replaces these sample results."
      - "It will learn from VisA, a public dataset of industrial defects, free for commercial use."
      - "The model is RF-DETR Nano, fine-tuned on a regular CPU, under the Apache license."
      - "A simulated conveyor will stream the images, so no camera is needed."
      - "And its results will reach Odoo through this same connector."

  - id: end
    kind: cover
    title: Thank you
    subtitle: "Vision Inspection · ForgeFlow"
    say: "Thank you for watching."
